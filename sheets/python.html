title: Python
eyebrow: Python 3.10+ · syntax, stdlib, tooling
lede: Core syntax, collections, comprehensions, functions, classes, error handling, files, and the standard library modules you reach for most.
footer: `python -m this`, `help(obj)` and `dir(obj)` answer most questions interactively.

== Basics | types and strings
x = 5 ; y = 2.5 ; s = "hi" ; b = True ; n = None ## Literals
type(x) ; isinstance(x, int) ## Type check
int("5") ; float("2.5") ; str(5) ; bool(0) ## Conversion
10 // 3 ; 10 % 3 ; 2 ** 8 ; divmod(10, 3) ## Floor div, modulo, power
f"{name} is {age:>3}" ; f"{x=}" ; f"{pi:.2f}" ; f"{n:,}" ## f-strings: align, debug, precision, thousands
f"{n:08.3f}" ; f"{n:b}" ; f"{n:x}" ; f"{p:.1%}" ## Pad, binary, hex, percent
"a,b".split(",") ; ",".join(items) ## Split / join
s.strip() ; s.lower() ; s.replace("a", "b") ; s.startswith("x") ## Common string methods
s[0] ; s[-1] ; s[1:4] ; s[::-1] ## Index, slice, reverse
"""multi
line""" ## Triple-quoted string
r"C:\path\no\escapes" ## Raw string
a, b = b, a ; first, *rest = items ## Swap; unpacking
x if cond else y ; x or default ; x and y ## Conditional expression, short-circuit
if (n := len(items)) > 3: ... ## Walrus operator

== Collections | list, dict, set, tuple
lst = [1, 2, 3] ; lst.append(4) ; lst.extend([5]) ; lst.insert(0, 9) ## List
lst.pop() ; lst.remove(2) ; lst.sort() ; sorted(lst, key=len, reverse=True) ## Remove and sort
lst[1:3] ; lst[::2] ; lst + other ; [0] * 5 ## Slice, step, concat, repeat
len(lst) ; x in lst ; lst.index(x) ; lst.count(x) ## Query
d = {"a": 1} ; d["b"] = 2 ; d.get("c", 0) ; d.setdefault("k", []) ## Dict
d.items() ; d.keys() ; d.values() ; d.pop("a", None) ## Views and removal
d | other ; d |= other ; {**d, **other} ## Merge dicts (3.9+ operators)
s = {1, 2} ; s.add(3) ; s | t ; s & t ; s - t ; s ^ t ## Set: add, union, intersection, difference, symmetric diff
t = (1, 2) ; (1,) ## Tuple (immutable); one-element needs the comma
list(zip(a, b)) ; dict(zip(keys, vals)) ## Pair up
for i, v in enumerate(lst, start=1): ... ## Index and value
for k, v in d.items(): ... ## Dict iteration
any(x > 3 for x in lst) ; all(...) ; sum(lst) ; min(lst) ; max(lst, key=f) ## Aggregates
reversed(lst) ; sorted(d, key=d.get) ; list(map(f, lst)) ; list(filter(f, lst)) ## Functional helpers

== Comprehensions | and generators
[x * x for x in range(10) if x % 2 == 0] ## List comprehension
{k: v for k, v in pairs} ## Dict comprehension
{x % 3 for x in nums} ## Set comprehension
(x * x for x in range(10**6)) ## Generator expression (lazy)
[y for x in matrix for y in x] ## Flatten nested
def gen(): yield 1; yield 2 ## Generator function
yield from other_iterable ## Delegate to another generator
next(it, None) ; iter(lst) ## Manual iteration with default

== Functions | definitions
def f(a, b=2, *args, key=None, **kwargs): ... ## Params: default, varargs, keyword-only, kwargs
def f(a, /, b, *, c): ... ## `/` positional-only, `*` keyword-only
f(*args, **kwargs) ; f(**{"a": 1}) ## Unpack arguments
lambda x: x * 2 ## Anonymous function
def f(x: int, y: str | None = None) -> bool: ... ## Type hints
@decorator ## Apply a decorator
functools.wraps(fn) ## Keep metadata inside decorators
functools.lru_cache(maxsize=None) ; functools.cache ## Memoize
functools.partial(f, 1) ## Pre-fill arguments
global x ; nonlocal x ## Rebind outer variables

== Classes | OOP and dataclasses
class A(Base): ## Define a class
    def __init__(self, x): self.x = x ## Constructor
    def __repr__(self): return f"A({self.x!r})" ## Debug representation
    @property ## Computed attribute
    @staticmethod ; @classmethod ## No self / receives cls
    __slots__ = ("x",) ## Restrict attributes, save memory
super().__init__(x) ## Call parent
@dataclass ## Generated __init__, __repr__, __eq__ (from dataclasses)
@dataclass(frozen=True, slots=True) ## Immutable, memory-efficient
x: int = field(default_factory=list) ## Mutable defaults need a factory
__eq__ __lt__ __hash__ __len__ __iter__ __getitem__ __enter__ __exit__ ## Common dunder methods
isinstance(o, A) ; issubclass(B, A) ; getattr(o, "x", None) ; hasattr(o, "x") ## Introspection
class Color(Enum): RED = 1 ## Enum (from enum)
Protocol ; ABC ; abstractmethod ## Interfaces (typing / abc)

== Control flow & errors | try, with, match
for x in items: ... else: ... ## `else` runs if no break
while cond: ... ## While loop
match cmd: case "go": ... case [x, y]: ... case {"a": a}: ... case _: ... ## Structural pattern matching (3.10+)
try: ... except (A, B) as e: ... else: ... finally: ... ## Exceptions
raise ValueError("bad") ; raise X from e ## Raise, chain
with open(p) as f: ... ## Context manager closes automatically
with a as x, b as y: ... ## Multiple managers
contextlib.suppress(FileNotFoundError) ## Ignore specific errors
assert x > 0, "message" ## Debug check
exception groups: except* ValueError ## Handle ExceptionGroup (3.11+)

== Files & paths | pathlib, json, csv
from pathlib import Path ; p = Path("a") / "b.txt" ## Paths with /
p.read_text(encoding="utf-8") ; p.write_text(s) ## Whole-file text
p.exists() ; p.is_file() ; p.mkdir(parents=True, exist_ok=True) ## Checks and mkdir -p
p.glob("**/*.py") ; p.suffix ; p.stem ; p.parent ; p.resolve() ## Walk and parts
with open(p, encoding="utf-8") as f: for line in f: ... ## Stream lines
import json ; json.loads(s) ; json.dumps(o, indent=2) ## JSON strings
json.load(f) ; json.dump(o, f) ## JSON files
import csv ; csv.DictReader(f) ; csv.DictWriter(f, fieldnames) ## CSV
shutil.copy(a, b) ; shutil.rmtree(d) ; shutil.which("git") ## Copy, delete tree, find executable
tempfile.TemporaryDirectory() ## Auto-cleaned temp dir
os.environ.get("HOME") ; os.getcwd() ## Environment and cwd

== Standard library | batteries
from collections import Counter, defaultdict, deque, namedtuple, OrderedDict ## Useful containers
Counter(words).most_common(3) ## Frequency count
defaultdict(list)["k"].append(1) ## Auto-create values
itertools.chain(a, b) ; islice(it, 5) ; product(a, b) ; groupby(data, key) ; batched(it, 3) ## Iteration tools
from datetime import datetime, timedelta, timezone ## Dates
datetime.now(timezone.utc) ; dt.isoformat() ; datetime.fromisoformat(s) ## Now, format, parse
dt.strftime("%Y-%m-%d %H:%M") ; datetime.strptime(s, "%Y-%m-%d") ## Custom formats
re.search(r"(\d+)", s) ; re.findall(...) ; re.sub(pat, rep, s) ; re.compile(pat) ## Regex
subprocess.run(["ls", "-l"], capture_output=True, text=True, check=True) ## Run a command
argparse.ArgumentParser() ; p.add_argument("--n", type=int) ; p.parse_args() ## CLI arguments
logging.basicConfig(level=logging.INFO) ; log = logging.getLogger(__name__) ## Logging
hashlib.sha256(b"x").hexdigest() ; uuid.uuid4() ; secrets.token_hex(16) ## Hash, UUID, secure random
random.choice(x) ; random.randint(1, 6) ; random.shuffle(x) ## Random (not for secrets)
urllib.request.urlopen(url) ## Built-in HTTP (use `requests`/`httpx` for convenience)
concurrent.futures.ThreadPoolExecutor() ; ProcessPoolExecutor() ## Pools for parallel work
asyncio.run(main()) ; await asyncio.gather(a(), b()) ## Async basics
time.perf_counter() ## High-resolution timer

== Environment & tooling | CLI
python -m venv .venv ## Create a virtual environment
source .venv/bin/activate ; .venv\Scripts\Activate.ps1 ## Activate (Unix / Windows PowerShell)
pip install -r requirements.txt ; pip freeze > requirements.txt ## Install / export
pip install -U pkg ; pip uninstall pkg ; pip list --outdated ## Manage packages
python -m http.server 8000 ## Serve the current folder
python -m json.tool file.json ## Pretty-print JSON
python -m pytest -q -x -k name ## Run tests: quiet, stop at first failure, by name
python -m pdb script.py ; breakpoint() ## Debugger
uv venv ; uv pip install pkg ; uv run script.py ## uv: fast resolver and runner
ruff check . ; ruff format . ## Lint and format
mypy . ; pyright ## Type check
python -X importtime -c "import pkg" ## Why is import slow?
python -c "import sys; print(sys.version)" ## One-liner
