# Zarf package for the dev-tools static server (docker/server, see Dockerfile).
#   docker build -t dev-tools:1.3.0 .
#   zarf package create .
#   zarf package deploy zarf-package-dev-tools-*.tar.zst --confirm
# then: kubectl -n dev-tools port-forward svc/dev-tools 9999:9999
kind: ZarfPackageConfig
metadata:
  name: dev-tools
  version: 1.3.0
  description: Offline cheat sheets and browser-based developer tools (UCI, OMS, NATS, XML and more)
  architecture: amd64

components:
  - name: dev-tools
    required: true
    description: The dev-tools web server and its Kubernetes manifests
    manifests:
      - name: dev-tools
        namespace: dev-tools
        files:
          - zarf/dev-tools.yaml
    images:
      - dev-tools:1.3.0
