apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-tools
  labels:
    app.kubernetes.io/name: dev-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-tools
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dev-tools
          image: dev-tools:1.4.0
          env:
            - { name: PORT, value: "9999" }
          ports:
            - name: http
              containerPort: 9999
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: dev-tools
  labels:
    app.kubernetes.io/name: dev-tools
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dev-tools
  ports:
    - name: http
      port: 9999
      targetPort: http
      nodePort: 30999
